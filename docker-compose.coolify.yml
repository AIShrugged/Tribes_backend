services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["backend"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_ENV: "${APP_ENV}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["queue-worker"]
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_ENV: "${APP_ENV}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["schedule"]
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: .docker/nginx.Dockerfile
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      # - "traefik.enable=true"

      # - "traefik.http.routers.devapi.rule=Host(`dev-api.shrugged.ai`)"
      # - "traefik.http.routers.devapi.entrypoints=http"
      # - "traefik.http.routers.devapi.middlewares=devapi-redirect,gzip"
      # - "traefik.http.middlewares.devapi-redirect.redirectscheme.scheme=https"
      # - "traefik.http.middlewares.gzip.compress=true"

      # - "traefik.http.routers.devapi-secure.rule=Host(`dev-api.shrugged.ai`)"
      # - "traefik.http.routers.devapi-secure.entrypoints=https"
      # - "traefik.http.routers.devapi-secure.tls=true"
      # - "traefik.http.routers.devapi-secure.tls.certresolver=letsencrypt"
      # - "traefik.http.routers.devapi-secure.middlewares=gzip"
      # - "traefik.http.routers.devapi-secure.service=devapi-svc"
      # - "traefik.http.services.devapi-svc.loadbalancer.server.port=80"

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
