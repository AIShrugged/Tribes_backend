services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}

      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key.pem
      GITHUB_APP_PRIVATE_KEY_PEM: "${GITHUB_APP_PRIVATE_KEY_PEM:-}"
      GITHUB_DEFAULT_OWNER: ${GITHUB_DEFAULT_OWNER}
      GITHUB_DEFAULT_REPO: ${GITHUB_DEFAULT_REPO}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["backend"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_ENV: "${APP_ENV}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"

      GITHUB_APP_ID: "${GITHUB_APP_ID}"
      GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID}"
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key.pem
      GITHUB_APP_PRIVATE_KEY_PEM: "${GITHUB_APP_PRIVATE_KEY_PEM:-}"
      GITHUB_DEFAULT_OWNER: "${GITHUB_DEFAULT_OWNER}"
      GITHUB_DEFAULT_REPO: "${GITHUB_DEFAULT_REPO}"

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"

      BUILD_SANDBOX_IMAGE_ON_START: "1"
      SANDBOX_INTERNAL_BASE_URL: http://nginx
      AGENT_TASK_SANDBOX_IMAGE: "${AGENT_TASK_SANDBOX_IMAGE:-spodial-agent-python:latest}"
      AGENT_TASK_SANDBOX_DOCKERFILE: deploy/sandbox/python/Dockerfile
      AGENT_TASK_SANDBOX_BUILD_CONTEXT: deploy/sandbox/python
      AGENT_TASK_SANDBOX_NETWORK: "${AGENT_TASK_SANDBOX_NETWORK}"
      QUEUE_NAMES: default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["queue-worker"]
    restart: unless-stopped

  queue-agent:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_ENV: "${APP_ENV}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"

      GITHUB_APP_ID: "${GITHUB_APP_ID}"
      GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID}"
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key.pem
      GITHUB_APP_PRIVATE_KEY_PEM: "${GITHUB_APP_PRIVATE_KEY_PEM:-}"
      GITHUB_DEFAULT_OWNER: "${GITHUB_DEFAULT_OWNER}"
      GITHUB_DEFAULT_REPO: "${GITHUB_DEFAULT_REPO}"

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"

      BUILD_SANDBOX_IMAGE_ON_START: "1"
      SANDBOX_INTERNAL_BASE_URL: http://nginx
      AGENT_TASK_SANDBOX_IMAGE: "${AGENT_TASK_SANDBOX_IMAGE:-spodial-agent-python:latest}"
      AGENT_TASK_SANDBOX_DOCKERFILE: deploy/sandbox/python/Dockerfile
      AGENT_TASK_SANDBOX_BUILD_CONTEXT: deploy/sandbox/python
      AGENT_TASK_SANDBOX_NETWORK: "${AGENT_TASK_SANDBOX_NETWORK}"
      AGENT_TASK_SANDBOX_HOST_RUNS_ROOT: "${AGENT_TASK_SANDBOX_HOST_RUNS_ROOT}"
      AGENT_TASK_SANDBOX_RUN_ROOT: "${AGENT_TASK_SANDBOX_HOST_RUNS_ROOT}"
      QUEUE_NAMES: agent-tasks
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AGENT_TASK_SANDBOX_HOST_RUNS_ROOT:-/tmp/spodial-sandbox-runs}:${AGENT_TASK_SANDBOX_HOST_RUNS_ROOT:-/tmp/spodial-sandbox-runs}
    command: ["queue-worker"]
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_ENV: "${APP_ENV}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"

      GITHUB_APP_ID: "${GITHUB_APP_ID}"
      GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID}"
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key.pem
      GITHUB_APP_PRIVATE_KEY_PEM: "${GITHUB_APP_PRIVATE_KEY_PEM:-}"
      GITHUB_DEFAULT_OWNER: "${GITHUB_DEFAULT_OWNER}"
      GITHUB_DEFAULT_REPO: "${GITHUB_DEFAULT_REPO}"

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["schedule"]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - minio-data:/data
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: .docker/nginx.Dockerfile
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  redis:
    image: redis:7-alpine
    command: >
      sh -c 'if [ -n "$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$REDIS_PASSWORD";
      else
        redis-server;
      fi'
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    restart: unless-stopped

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
  minio-data:
