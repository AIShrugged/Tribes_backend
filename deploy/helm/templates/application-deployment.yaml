apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spodial-hr-backend.fullname" . }}-application
  labels:
    spodial-hr-backend: backend
    {{- include "spodial-hr-backend.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      spodial-hr-backend: backend
      {{- include "spodial-hr-backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        spodial-hr-backend: backend
        {{- include "spodial-hr-backend.labels" . | nindent 8 }}
    spec:
      imagePullSecrets:
        - name: {{ include "spodial-hr-backend.fullname" . }}-application-pull-secret
      terminationGracePeriodSeconds: {{ .Values.application.gracefulShutdownSeconds | default 30 }}
      containers:
        - name: application
          image: "{{ .Values.application.image.registry }}/{{ .Values.application.image.repository }}:{{ .Values.application.image.tag }}"
          imagePullPolicy: {{ .Values.application.image.pullPolicy }}
          args: ["backend"]
          env:
          - name: GRACEFUL_SHUTDOWN_SECONDS
            value: {{ quote .Values.application.gracefulShutdownSeconds }}
          envFrom:
          - configMapRef:
              name: {{ include "spodial-hr-backend.fullname" . }}-application-envs
          {{- with .Values.application.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.application.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.application.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/kill", "-SIGTERM", "7"]          
        - name: nginx
          image: "{{ .Values.application.image.registry }}/{{ .Values.application.image.repository }}:{{ .Values.application.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          ports:
            - name: nginx-http
              containerPort: {{ .Values.nginx.service.port }}
              protocol: TCP
          args: ["nginx"]              
          {{- with .Values.nginx.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nginx.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nginx.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - mountPath: /etc/nginx/http.d
              name: application-nginx-config
      volumes:
      - name: application-nginx-config
        configMap:
          name: {{ include "spodial-hr-backend.fullname" . }}-application-nginx-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
