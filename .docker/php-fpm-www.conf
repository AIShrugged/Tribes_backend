[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data

; Static PM: predictable memory footprint, no spawn overhead under burst.
; Set pm.max_children based on available RAM: ~30–50 for 2–4 GB nodes.
; Override via PHP_FPM_MAX_CHILDREN env in compose if needed.
pm = static
pm.max_children = 30
pm.max_requests = 500

; Raise memory limit for web workers (transcripts, exports, LLM responses).
php_admin_value[memory_limit] = 512M

; Surface worker errors to stderr → Docker log aggregation.
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /dev/stderr
