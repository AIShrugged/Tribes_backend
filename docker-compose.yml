services:
    backend:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: backend
        working_dir: /var/www
        environment:
            APP_ENV: "${APP_ENV}"
            APP_DEBUG: "${APP_DEBUG}"
            APP_KEY: "${APP_KEY}"
            APP_URL: "${APP_URL}"
            GITHUB_APP_ID: "${GITHUB_APP_ID}"
            GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID}"
            GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key.pem
            GITHUB_APP_PRIVATE_KEY_PEM: "${GITHUB_APP_PRIVATE_KEY_PEM:-}"
            GITHUB_DEFAULT_OWNER: "${GITHUB_DEFAULT_OWNER}"
            GITHUB_DEFAULT_REPO: "${GITHUB_DEFAULT_REPO}"
            SANDBOX_INTERNAL_BASE_URL: http://nginx
            AGENT_TASK_SANDBOX_NETWORK: spodial_hr_backend_app
        volumes:
            - .:/var/www
            - /var/run/docker.sock:/var/run/docker.sock
            #- .docker/php-fpm.conf:/usr/local/etc/php-fpm.conf            
        depends_on:
            - postgres
        networks:
            - app
        command: ["backend"]

    nginx:
        image: nginx:alpine
        container_name: nginx
        volumes:
            - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf            
            - .:/var/www
        depends_on:
            - backend
        networks:
            - app
        command: ["nginx", "-g", "daemon off;"]
        ports:
            - "80:80"

    postgres:
        image: postgres:16
        container_name: postgres
        restart: always
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - app
        ports:
            - "5432:5432"

    minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        container_name: minio
        restart: always
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
        command: ["server", "/data", "--console-address", ":9001"]
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s
        volumes:
            - minio-data:/data
        networks:
            - app
        ports:
            - "9000:9000"
            - "9001:9001"

    minio-init:
        image: minio/mc:RELEASE.2025-08-13T08-35-41Z
        depends_on:
            minio:
                condition: service_healthy
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
            MINIO_BUCKET: ${MINIO_BUCKET:-spodial-workspaces}
        entrypoint:
            - /bin/sh
            - -c
            - |
              until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
                sleep 1
              done
              mc mb -p "local/$$MINIO_BUCKET" || true
              mc anonymous set none "local/$$MINIO_BUCKET" || true
        networks:
            - app

    queue:
        build:
            context: .
            dockerfile: Dockerfile
        working_dir: /var/www
        environment:
            APP_ENV: "${APP_ENV}"
            APP_DEBUG: "${APP_DEBUG}"
            APP_KEY: "${APP_KEY}"
            APP_URL: "${APP_URL}"
            GITHUB_APP_ID: "${GITHUB_APP_ID}"
            GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID}"
            GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key.pem
            GITHUB_APP_PRIVATE_KEY_PEM: "${GITHUB_APP_PRIVATE_KEY_PEM:-}"
            GITHUB_DEFAULT_OWNER: "${GITHUB_DEFAULT_OWNER}"
            GITHUB_DEFAULT_REPO: "${GITHUB_DEFAULT_REPO}"
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: "${DB_DATABASE}"
            DB_USERNAME: "${DB_USERNAME}"
            DB_PASSWORD: "${DB_PASSWORD}"
            QUEUE_CONNECTION: redis
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            BUILD_SANDBOX_IMAGE_ON_START: "1"
            SANDBOX_INTERNAL_BASE_URL: http://nginx
            AGENT_TASK_SANDBOX_IMAGE: "${AGENT_TASK_SANDBOX_IMAGE:-spodial-agent-python:latest}"
            AGENT_TASK_SANDBOX_DOCKERFILE: deploy/sandbox/python/Dockerfile
            AGENT_TASK_SANDBOX_BUILD_CONTEXT: deploy/sandbox/python
            AGENT_TASK_SANDBOX_NETWORK: "${AGENT_TASK_SANDBOX_NETWORK}"
            # Single local worker drains all queues; order = priority (chat first for interactive).
            QUEUE_NAMES: chat,notifications,heavy,default,agent-tasks
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
        volumes:
            - .:/var/www
            - /var/run/docker.sock:/var/run/docker.sock
        networks:
            - app
        command: ["queue-worker"]
        restart: unless-stopped

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        working_dir: /var/www
        environment:
            APP_ENV: "${APP_ENV}"
            APP_DEBUG: "${APP_DEBUG}"
            APP_KEY: "${APP_KEY}"
            APP_URL: "${APP_URL}"
            GITHUB_APP_ID: "${GITHUB_APP_ID}"
            GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID}"
            GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key.pem
            GITHUB_APP_PRIVATE_KEY_PEM: "${GITHUB_APP_PRIVATE_KEY_PEM:-}"
            GITHUB_DEFAULT_OWNER: "${GITHUB_DEFAULT_OWNER}"
            GITHUB_DEFAULT_REPO: "${GITHUB_DEFAULT_REPO}"
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: "${DB_DATABASE}"
            DB_USERNAME: "${DB_USERNAME}"
            DB_PASSWORD: "${DB_PASSWORD}"
            QUEUE_CONNECTION: redis
            CACHE_STORE: redis
            SESSION_DRIVER: redis
            REDIS_HOST: redis
            REDIS_PORT: 6379
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
        volumes:
            - .:/var/www
        networks:
            - app
        command: ["schedule"]
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        networks:
            - app
networks:
    app:

volumes:
    pgdata:
    minio-data:
