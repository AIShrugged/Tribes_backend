services:
    backend:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: backend
        working_dir: /var/www
        environment:
            SANDBOX_INTERNAL_BASE_URL: http://nginx
            AGENT_TASK_SANDBOX_NETWORK: spodial_hr_backend_app
            AGENT_TASK_SANDBOX_HOST_RUNS_ROOT: /home/anor/projects/spodial_hr_backend/storage/app/private/sandbox-runs
        volumes:
            - .:/var/www
            - /var/run/docker.sock:/var/run/docker.sock
            #- .docker/php-fpm.conf:/usr/local/etc/php-fpm.conf            
        depends_on:
            - postgres
        networks:
            - app
        command: ["backend"]

    nginx:
        image: nginx:alpine
        container_name: nginx
        volumes:
            - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf            
            - .:/var/www
        depends_on:
            - backend
        networks:
            - app
        command: ["nginx", "-g", "daemon off;"]
        ports:
            - "80:80"

    postgres:
        image: postgres:16
        container_name: postgres
        restart: always
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - app
        ports:
            - "5432:5432"

networks:
    app:

volumes:
    pgdata:
