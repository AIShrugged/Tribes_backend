services:
    backend:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: backend
        working_dir: /var/www
        volumes:
            - .:/var/www
        depends_on:
            - postgres
        networks:
            - app
        command: ["backend"]

    nginx:
        image: nginx:alpine
        container_name: nginx
        ports:
            - "80:80"
        volumes:
            - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf
            - .:/var/www
        depends_on:
            - backend
        networks:
            - app
        command: ["nginx", "-g", "daemon off;"]

    postgres:
        image: postgres:16
        container_name: postgres
        restart: always
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - pgdata:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        networks:
            - app

networks:
    app:

volumes:
    pgdata:
