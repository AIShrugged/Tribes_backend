services:
    backend:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: backend
        working_dir: /var/www
        environment:
            SANDBOX_INTERNAL_BASE_URL: http://nginx
            AGENT_TASK_SANDBOX_NETWORK: spodial_hr_backend_app
            AGENT_TASK_SANDBOX_HOST_RUNS_ROOT: /home/anor/projects/spodial_hr_backend/storage/app/private/sandbox-runs
        volumes:
            - .:/var/www
            - /var/run/docker.sock:/var/run/docker.sock
            #- .docker/php-fpm.conf:/usr/local/etc/php-fpm.conf            
        depends_on:
            - postgres
        networks:
            - app
        command: ["backend"]

    nginx:
        image: nginx:alpine
        container_name: nginx
        volumes:
            - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf            
            - .:/var/www
        depends_on:
            - backend
        networks:
            - app
        command: ["nginx", "-g", "daemon off;"]
        ports:
            - "80:80"

    postgres:
        image: postgres:16
        container_name: postgres
        restart: always
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - app
        ports:
            - "5432:5432"

    minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        container_name: minio
        restart: always
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
        command: ["server", "/data", "--console-address", ":9001"]
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s
        volumes:
            - minio-data:/data
        networks:
            - app
        ports:
            - "9000:9000"
            - "9001:9001"

    minio-init:
        image: minio/mc:RELEASE.2025-08-13T08-35-41Z
        depends_on:
            minio:
                condition: service_healthy
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
            MINIO_BUCKET: ${MINIO_BUCKET:-spodial-workspaces}
        entrypoint:
            - /bin/sh
            - -c
            - |
              until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
                sleep 1
              done
              mc mb -p "local/$$MINIO_BUCKET" || true
              mc anonymous set none "local/$$MINIO_BUCKET" || true
        networks:
            - app

networks:
    app:

volumes:
    pgdata:
    minio-data:
