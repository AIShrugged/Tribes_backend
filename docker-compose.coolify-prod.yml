services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_ENV: "${APP_ENV}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
    depends_on:
      - postgres
    networks:
      - app
    command:
      - backend

  nginx:
    build:
      context: .
      dockerfile: .docker/nginx.Dockerfile
    depends_on:
      - backend
    networks:
      - app
    labels:
      - traefik.enable=true

      # gzip
      - traefik.http.middlewares.gzip.compress=true

      # redirect http -> https
      - traefik.http.middlewares.api-redirect.redirectscheme.scheme=https

      # HTTP router (80) -> redirect to https
      - traefik.http.routers.api.rule=Host(`api.shrugged.ai`)
      - traefik.http.routers.api.entrypoints=http
      - traefik.http.routers.api.middlewares=api-redirect,gzip

      # HTTPS router (443)
      - traefik.http.routers.api-secure.rule=Host(`api.shrugged.ai`)
      - traefik.http.routers.api-secure.entrypoints=https
      - traefik.http.routers.api-secure.tls=true
      - traefik.http.routers.api-secure.middlewares=gzip
      - traefik.http.routers.api-secure.service=api-svc

      # Service target inside container network
      - traefik.http.services.api-svc.loadbalancer.server.port=80

  postgres:
    image: "postgres:16"
    restart: always
    environment:
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    networks:
      - app

networks:
  app: null

volumes:
  pgdata: null
