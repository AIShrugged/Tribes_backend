services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_ENV: "${APP_ENV}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
    depends_on:
      - postgres
    networks:
      - app
    command:
      - backend

  nginx:
    build:
      context: .
      dockerfile: .docker/nginx.Dockerfile
    depends_on:
      - backend
    networks:
      - app
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.api-prod.rule=Host(`api.shrugged.ai`)"
      - "traefik.http.routers.api-prod.entrypoints=http"
      - "traefik.http.routers.api-prod.middlewares=api-prod-redirect,api-prod-gzip"
      - "traefik.http.middlewares.api-prod-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.api-prod-gzip.compress=true"

      - "traefik.http.routers.api-prod-secure.rule=Host(`api.shrugged.ai`)"
      - "traefik.http.routers.api-prod-secure.entrypoints=https"
      - "traefik.http.routers.api-prod-secure.tls=true"
      - "traefik.http.routers.api-prod-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api-prod-secure.middlewares=api-prod-gzip"
      - "traefik.http.routers.api-prod-secure.service=api-prod-svc"
      - "traefik.http.services.api-prod-svc.loadbalancer.server.port=80"

  postgres:
    image: "postgres:16"
    restart: always
    environment:
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    networks:
      - app

networks:
  app: null

volumes:
  pgdata: null
