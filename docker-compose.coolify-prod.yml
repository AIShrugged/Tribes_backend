services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_ENV: "${APP_ENV}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"

      GITHUB_APP_ID: "${GITHUB_APP_ID}"
      GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID}"
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key.pem
      GITHUB_APP_PRIVATE_KEY_PEM: "${GITHUB_APP_PRIVATE_KEY_PEM:-}"
      GITHUB_DEFAULT_OWNER: "${GITHUB_DEFAULT_OWNER}"
      GITHUB_DEFAULT_REPO: "${GITHUB_DEFAULT_REPO}"

      DB_CONNECTION: pgsql
      DB_HOST: app-postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: app-redis
      REDIS_PORT: 6379
    depends_on:
      app-postgres:
        condition: service_healthy
      app-redis:
        condition: service_started
    networks:
      - app
    volumes:
      - ./.docker/php-fpm-www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    command: ["backend"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_ENV: "${APP_ENV}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"

      GITHUB_APP_ID: "${GITHUB_APP_ID}"
      GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID}"
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key.pem
      GITHUB_APP_PRIVATE_KEY_PEM: "${GITHUB_APP_PRIVATE_KEY_PEM:-}"
      GITHUB_DEFAULT_OWNER: "${GITHUB_DEFAULT_OWNER}"
      GITHUB_DEFAULT_REPO: "${GITHUB_DEFAULT_REPO}"

      DB_CONNECTION: pgsql
      DB_HOST: app-postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: app-redis
      REDIS_PORT: 6379

      BUILD_SANDBOX_IMAGE_ON_START: "1"
      SANDBOX_INTERNAL_BASE_URL: http://nginx
      AGENT_TASK_SANDBOX_IMAGE: "${AGENT_TASK_SANDBOX_IMAGE:-spodial-agent-python:latest}"
      AGENT_TASK_SANDBOX_DOCKERFILE: deploy/sandbox/python/Dockerfile
      AGENT_TASK_SANDBOX_BUILD_CONTEXT: deploy/sandbox/python
      AGENT_TASK_SANDBOX_NETWORK: "${AGENT_TASK_SANDBOX_NETWORK}"
      QUEUE_NAMES: default
    depends_on:
      app-postgres:
        condition: service_healthy
      app-redis:
        condition: service_started
    networks:
      - app
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["queue-worker"]
    restart: unless-stopped
    stop_grace_period: 720s

  queue-agent:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_ENV: "${APP_ENV}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"

      GITHUB_APP_ID: "${GITHUB_APP_ID}"
      GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID}"
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key.pem
      GITHUB_APP_PRIVATE_KEY_PEM: "${GITHUB_APP_PRIVATE_KEY_PEM:-}"
      GITHUB_DEFAULT_OWNER: "${GITHUB_DEFAULT_OWNER}"
      GITHUB_DEFAULT_REPO: "${GITHUB_DEFAULT_REPO}"

      DB_CONNECTION: pgsql
      DB_HOST: app-postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: app-redis
      REDIS_PORT: 6379

      BUILD_SANDBOX_IMAGE_ON_START: "1"
      SANDBOX_INTERNAL_BASE_URL: http://nginx
      AGENT_TASK_SANDBOX_IMAGE: "${AGENT_TASK_SANDBOX_IMAGE:-spodial-agent-python:latest}"
      AGENT_TASK_SANDBOX_DOCKERFILE: deploy/sandbox/python/Dockerfile
      AGENT_TASK_SANDBOX_BUILD_CONTEXT: deploy/sandbox/python
      AGENT_TASK_SANDBOX_NETWORK: "${AGENT_TASK_SANDBOX_NETWORK}"
      QUEUE_NAMES: agent-tasks
    depends_on:
      app-postgres:
        condition: service_healthy
      app-redis:
        condition: service_started
    networks:
      - app
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["queue-worker"]
    restart: unless-stopped
    # Agent tasks can run up to 65 min; keep grace period as long as practical
    stop_grace_period: 900s

  queue-chat:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_ENV: "${APP_ENV}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"

      GITHUB_APP_ID: "${GITHUB_APP_ID}"
      GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID}"
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key.pem
      GITHUB_APP_PRIVATE_KEY_PEM: "${GITHUB_APP_PRIVATE_KEY_PEM:-}"
      GITHUB_DEFAULT_OWNER: "${GITHUB_DEFAULT_OWNER}"
      GITHUB_DEFAULT_REPO: "${GITHUB_DEFAULT_REPO}"

      DB_CONNECTION: pgsql
      DB_HOST: app-postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: app-redis
      REDIS_PORT: 6379

      # Dedicated worker for interactive web/Telegram agent responses so they
      # aren't starved behind heavy jobs on the default queue. No sandbox build
      # or docker.sock — chat jobs never run isolated agent-task containers.
      QUEUE_NAMES: chat
    depends_on:
      app-postgres:
        condition: service_healthy
      app-redis:
        condition: service_started
    networks:
      - app
    command: ["queue-worker"]
    restart: unless-stopped
    stop_grace_period: 720s
    deploy:
      replicas: 3

  queue-heavy:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_ENV: "${APP_ENV}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"

      GITHUB_APP_ID: "${GITHUB_APP_ID}"
      GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID}"
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key.pem
      GITHUB_APP_PRIVATE_KEY_PEM: "${GITHUB_APP_PRIVATE_KEY_PEM:-}"
      GITHUB_DEFAULT_OWNER: "${GITHUB_DEFAULT_OWNER}"
      GITHUB_DEFAULT_REPO: "${GITHUB_DEFAULT_REPO}"

      DB_CONNECTION: pgsql
      DB_HOST: app-postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: app-redis
      REDIS_PORT: 6379

      # Transcripts, digests, followups, and other long-running LLM jobs.
      # Isolated from interactive chat so a transcript burst can't starve users.
      QUEUE_NAMES: heavy
    depends_on:
      app-postgres:
        condition: service_healthy
      app-redis:
        condition: service_started
    networks:
      - app
    command: ["queue-worker"]
    restart: unless-stopped
    stop_grace_period: 720s

  queue-notifications:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_ENV: "${APP_ENV}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"

      GITHUB_APP_ID: "${GITHUB_APP_ID}"
      GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID}"
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key.pem
      GITHUB_APP_PRIVATE_KEY_PEM: "${GITHUB_APP_PRIVATE_KEY_PEM:-}"
      GITHUB_DEFAULT_OWNER: "${GITHUB_DEFAULT_OWNER}"
      GITHUB_DEFAULT_REPO: "${GITHUB_DEFAULT_REPO}"

      DB_CONNECTION: pgsql
      DB_HOST: app-postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: app-redis
      REDIS_PORT: 6379

      # Emails, agenda notifications, conflict notices, and other fast outbound jobs.
      QUEUE_NAMES: notifications
    depends_on:
      app-postgres:
        condition: service_healthy
      app-redis:
        condition: service_started
    networks:
      - app
    command: ["queue-worker"]
    restart: unless-stopped
    stop_grace_period: 720s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_ENV: "${APP_ENV}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"

      GITHUB_APP_ID: "${GITHUB_APP_ID}"
      GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID}"
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key.pem
      GITHUB_APP_PRIVATE_KEY_PEM: "${GITHUB_APP_PRIVATE_KEY_PEM:-}"
      GITHUB_DEFAULT_OWNER: "${GITHUB_DEFAULT_OWNER}"
      GITHUB_DEFAULT_REPO: "${GITHUB_DEFAULT_REPO}"

      DB_CONNECTION: pgsql
      DB_HOST: app-postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: app-redis
      REDIS_PORT: 6379
    depends_on:
      app-postgres:
        condition: service_healthy
      app-redis:
        condition: service_started
    networks:
      - app
    command: ["schedule"]
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: .docker/nginx.Dockerfile
    depends_on:
      - backend
    networks:
      - app
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.api-prod.rule=Host(`api.shrugged.ai`)"
      - "traefik.http.routers.api-prod.entrypoints=http"
      - "traefik.http.routers.api-prod.middlewares=api-prod-redirect,api-prod-gzip"
      - "traefik.http.middlewares.api-prod-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.api-prod-gzip.compress=true"

      - "traefik.http.routers.api-prod-secure.rule=Host(`api.shrugged.ai`)"
      - "traefik.http.routers.api-prod-secure.entrypoints=https"
      - "traefik.http.routers.api-prod-secure.tls=true"
      - "traefik.http.routers.api-prod-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api-prod-secure.middlewares=api-prod-gzip"
      - "traefik.http.routers.api-prod-secure.service=api-prod-svc"
      - "traefik.http.services.api-prod-svc.loadbalancer.server.port=80"

  app-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - app

  app-postgres:
    image: "postgres:16"
    restart: always
    environment:
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  app: null

volumes:
  pgdata: null
  redis-data: null
